<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>駁車時</title>
    <meta name="description" content="定出發地、揀兩程巴士，即時估轉乘站同上車時間。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div class="brand">駁車<span>時</span></div>
        <p class="tagline">三步搞掂：定位 → 揀兩程車 → 睇轉乘建議。</p>
        <ol class="steps" id="steps">
          <li class="step is-current" data-step="1"><span>1</span>出發</li>
          <li class="step" data-step="2"><span>2</span>路線</li>
          <li class="step" data-step="3"><span>3</span>轉乘</li>
        </ol>
      </header>

      <section class="panel flow">
        <!-- Step 1 -->
        <section class="flow-card" id="cardOrigin">
          <div class="flow-card-head">
            <p class="step-kicker">第 1 步</p>
            <h2>你而家喺邊？</h2>
          </div>
          <button class="cta locate" id="locateBtn" type="button">分享位置開始</button>
          <p class="status" id="originStatus">未定位。撳上面掣授權位置。</p>
        </section>

        <!-- Step 2 -->
        <section class="flow-card is-dim" id="cardRoutes">
          <div class="flow-card-head">
            <p class="step-kicker">第 2 步</p>
            <h2>搭邊兩程？</h2>
          </div>

          <div class="legs compact">
            <article class="leg">
              <div class="leg-head">
                <h3>第一程</h3>
              </div>
              <div class="field">
                <label for="co1">公司</label>
                <select id="co1">
                  <option value="KMB">九巴 / 龍運</option>
                  <option value="CTB">城巴</option>
                </select>
              </div>
              <div class="field">
                <label for="routeQuery1">路線編號</label>
                <input id="routeQuery1" placeholder="例如 1A" inputmode="text" autocomplete="off" />
              </div>
              <div class="field">
                <label for="route1">方向</label>
                <select id="route1" disabled>
                  <option value="">輸入路線後揀方向</option>
                </select>
              </div>
              <!-- hidden until advanced -->
              <select id="stop1" class="sr-only" tabindex="-1" aria-hidden="true"></select>
            </article>

            <article class="leg">
              <div class="leg-head">
                <h3>第二程</h3>
              </div>
              <div class="field">
                <label for="co2">公司</label>
                <select id="co2">
                  <option value="KMB">九巴 / 龍運</option>
                  <option value="CTB">城巴</option>
                </select>
              </div>
              <div class="field">
                <label for="routeQuery2">路線編號</label>
                <input id="routeQuery2" placeholder="例如 5" inputmode="text" autocomplete="off" />
              </div>
              <div class="field">
                <label for="route2">方向</label>
                <select id="route2" disabled>
                  <option value="">輸入路線後揀方向</option>
                </select>
              </div>
              <select id="stop2" class="sr-only" tabindex="-1" aria-hidden="true"></select>
            </article>
          </div>
        </section>

        <!-- Step 2.5: first-leg trip -->
        <section class="flow-card is-dim" id="cardBoard1">
          <div class="flow-card-head">
            <p class="step-kicker">第 2b 步</p>
            <h2>第一程上邊班？</h2>
          </div>
          <p class="hint" id="board1Hint">定位並揀好第一程路線後，會顯示可揀班次。</p>
          <div class="seg" role="radiogroup" aria-label="第一程班次方式">
            <label class="seg-item">
              <input type="radio" name="board1Mode" value="auto" checked />
              <span>自動下一班</span>
            </label>
            <label class="seg-item">
              <input type="radio" name="board1Mode" value="manual" />
              <span>人手揀班次</span>
            </label>
          </div>
          <div class="field" id="board1SelectWrap" hidden>
            <label for="board1Eta">班次（喺建議上車站）</label>
            <select id="board1Eta" disabled>
              <option value="">未有班次</option>
            </select>
          </div>
          <button class="chip-btn" id="refreshBoard1Btn" type="button" hidden>更新班次</button>
        </section>

        <!-- Step 3 -->
        <section class="flow-card is-dim" id="cardPlan">
          <div class="flow-card-head">
            <p class="step-kicker">第 3 步</p>
            <h2>點樣揀轉乘站？</h2>
          </div>

          <div class="seg" role="radiogroup" aria-label="轉乘模式">
            <label class="seg-item">
              <input type="radio" name="planMode" value="shortest_walk" checked />
              <span>最少步行</span>
            </label>
            <label class="seg-item">
              <input type="radio" name="planMode" value="fastest" />
              <span>最早上車</span>
            </label>
            <label class="seg-item">
              <input type="radio" name="planMode" value="manual" />
              <span>人手揀站</span>
            </label>
          </div>
          <p class="hint" id="modeHint">優先轉車兩站距離最短。</p>
        </section>

        <div id="output" class="output" aria-live="polite"></div>

        <details class="advanced" id="advanced">
          <summary>進階設定</summary>
          <div class="controls-grid">
            <div class="field" style="margin: 0">
              <label for="walkMinutes">轉車步行（分鐘）</label>
              <input id="walkMinutes" type="number" min="0" step="1" placeholder="自動" />
            </div>
            <div class="field" style="margin: 0">
              <label for="bufferMinutes">緩衝（分鐘）</label>
              <input id="bufferMinutes" type="number" min="0" step="1" value="1" />
            </div>
            <div class="field" style="margin: 0">
              <label for="maxTransferMeters">最大轉車距離（米）</label>
              <input id="maxTransferMeters" type="number" min="80" step="50" value="450" />
            </div>
          </div>
          <div class="field">
            <label for="stop1Visible">人手改第一程落車站</label>
            <select id="stop1Visible" disabled>
              <option value="">搵到建議後可改</option>
            </select>
          </div>
          <div class="field">
            <label for="stop2Visible">人手改第二程上車站</label>
            <select id="stop2Visible" disabled>
              <option value="">搵到建議後可改</option>
            </select>
          </div>
          <div id="nearbyBlock" class="nearby-block" hidden>
            <p class="hint" id="nearbyHint">附近站（人手模式）</p>
            <div id="nearbyList" class="nearby-list"></div>
          </div>
        </details>

        <p class="meta">資料：DATA.GOV.HK（KMB / Citybus）。轉乘建議暫時以九巴站座標為主。</p>
      </section>
    </main>

    <div class="sticky-bar">
      <p class="sticky-hint" id="stickyHint">先分享位置</p>
      <button class="cta" id="planBtn" type="button" disabled>開始搵轉乘</button>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
