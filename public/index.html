<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>駁車時</title>
    <meta name="description" content="搜兩程巴士路線，即刻睇轉乘時間。" />
    <meta name="theme-color" content="#083f3c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="駁車時" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <div class="brand">駁車<span>時</span></div>
        <p>好似地圖搜尋：打路線、撳一個建議，轉乘自己出。</p>
      </header>

      <section class="sheet" aria-label="搜尋轉乘">
        <div class="dir">
          <div class="stop-row">
            <div class="gutter" aria-hidden="true"><span class="pin me"></span></div>
            <div class="origin-row">
              <button class="origin" id="originBtn" type="button">
                <span id="originLabel">用我的位置</span>
              </button>
              <small id="originSub">可選。唔使定位都搜到</small>
            </div>
          </div>

          <div class="stop-row">
            <div class="gutter" aria-hidden="true"><span class="pin n">1</span></div>
            <div class="leg-col">
              <div class="field" id="field1">
                <input
                  id="q1"
                  placeholder="第一程路線，例如 1A"
                  autocomplete="off"
                  autocorrect="off"
                  autocapitalize="characters"
                  spellcheck="false"
                  enterkeyhint="search"
                  inputmode="text"
                  aria-label="第一程路線"
                  aria-autocomplete="list"
                  aria-controls="suggest"
                />
                <div class="chip" id="chip1" hidden></div>
                <button class="clear" id="clear1" type="button" hidden aria-label="清除第一程">×</button>
              </div>
              <label class="field-stop" id="stopLabel1" hidden>
                改第一程上車站
                <select id="stop1" disabled>
                  <option value="">用建議站</option>
                </select>
              </label>
              <label class="field-stop" id="boardLabel" hidden>
                揀邊班車
                <select id="board1Eta" disabled>
                  <option value="">自動下一班</option>
                </select>
              </label>
            </div>
          </div>

          <div class="stop-row is-swap">
            <div class="gutter" aria-hidden="true"></div>
            <button class="swap" id="swapBtn" type="button" aria-label="對調兩程">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path fill="currentColor" d="M7 3l-4 4 4 4V8h8V6H7V3zm10 9l4 4-4 4v-3H9v-2h8v-3z" />
              </svg>
              對調
            </button>
          </div>

          <div class="stop-row">
            <div class="gutter" aria-hidden="true"><span class="pin n second">2</span></div>
            <div class="leg-col">
              <div class="field" id="field2">
                <input
                  id="q2"
                  placeholder="第二程路線，例如 5"
                  autocomplete="off"
                  autocorrect="off"
                  autocapitalize="characters"
                  spellcheck="false"
                  enterkeyhint="search"
                  inputmode="text"
                  aria-label="第二程路線"
                  aria-autocomplete="list"
                  aria-controls="suggest"
                />
                <div class="chip" id="chip2" hidden></div>
                <button class="clear" id="clear2" type="button" hidden aria-label="清除第二程">×</button>
              </div>
              <label class="field-stop" id="stopLabel2" hidden>
                改第二程落車站
                <select id="stop2" disabled>
                  <option value="">用建議站</option>
                </select>
              </label>
            </div>
          </div>

          <div class="stop-row" id="transferRow" hidden>
            <div class="gutter" aria-hidden="true"><span class="pin n third">3</span></div>
            <div class="transfer-col">
              <p class="transfer-heading" id="stopLabel3">可轉車站</p>
              <ul class="transfer-list" id="transferList" role="listbox" aria-label="可轉車站"></ul>
            </div>
          </div>
        </div>

        <ul class="suggest" id="suggest" role="listbox" hidden></ul>
      </section>

      <p class="status" id="status" aria-live="polite">輸入兩程路線，結果會自動出現。</p>

      <section class="results" id="results" aria-live="polite"></section>

      <details class="tune" id="tune">
        <summary>調整時間同車站</summary>
        <div class="tune-grid">
          <label>
            緩衝（分鐘）
            <input id="bufferMinutes" type="number" min="0" step="1" value="1" />
          </label>
          <label>
            最遠轉車（米）
            <input id="maxTransferMeters" type="number" min="80" step="50" value="450" />
          </label>
          <label>
            步行（分鐘，空＝自動）
            <input id="walkMinutes" type="number" min="0" step="1" placeholder="自動" />
          </label>
        </div>
      </details>

      <p class="foot">資料：DATA.GOV.HK（KMB / Citybus）。轉乘站暫時以九巴座標為主。</p>
    </main>
    <script type="module" src="/app.js?v=12"></script>
  </body>
</html>
