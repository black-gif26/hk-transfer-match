<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>駁車時 — 兩程轉乘時間 Match</title>
    <meta
      name="description"
      content="用 KMB / Citybus 即時 ETA，檢查兩程巴士轉乘時間係咪 match。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div class="brand">駁車<span>時</span></div>
        <p class="tagline">
          兩程巴士轉乘時間 match：可用定位搵附近站，再對落車同上車 ETA 夠唔夠接。
        </p>
      </header>

      <section class="panel">
        <div class="nearby">
          <div class="nearby-head">
            <div>
              <h2>附近車站</h2>
              <p class="hint" id="nearbyHint">用手機定位搵最近九巴／龍運站，再一按填入轉乘。</p>
            </div>
            <button class="cta secondary" id="locateBtn" type="button">用我個位置</button>
          </div>
          <div id="nearbyList" class="nearby-list" aria-live="polite"></div>
        </div>

        <div class="legs">
          <article class="leg" data-leg="1">
            <div class="leg-head">
              <h2>第一程 · 落車</h2>
              <span class="badge">Leg 1</span>
            </div>
            <div class="field">
              <label for="co1">巴士公司</label>
              <select id="co1">
                <option value="KMB">九巴 / 龍運 KMB</option>
                <option value="CTB">城巴 Citybus</option>
              </select>
            </div>
            <div class="field">
              <label for="routeQuery1">路線</label>
              <div class="row">
                <input id="routeQuery1" placeholder="例如 1A" autocomplete="off" />
                <select id="route1" disabled>
                  <option value="">先輸入路線</option>
                </select>
              </div>
            </div>
            <div class="field">
              <label for="stop1">落車站</label>
              <select id="stop1" disabled>
                <option value="">選路線後載入車站</option>
              </select>
            </div>
          </article>

          <article class="leg" data-leg="2">
            <div class="leg-head">
              <h2>第二程 · 上車</h2>
              <span class="badge">Leg 2</span>
            </div>
            <div class="field">
              <label for="co2">巴士公司</label>
              <select id="co2">
                <option value="KMB">九巴 / 龍運 KMB</option>
                <option value="CTB">城巴 Citybus</option>
              </select>
            </div>
            <div class="field">
              <label for="routeQuery2">路線</label>
              <div class="row">
                <input id="routeQuery2" placeholder="例如 104" autocomplete="off" />
                <select id="route2" disabled>
                  <option value="">先輸入路線</option>
                </select>
              </div>
            </div>
            <div class="field">
              <label for="stop2">上車站</label>
              <select id="stop2" disabled>
                <option value="">選路線後載入車站</option>
              </select>
            </div>
          </article>
        </div>

        <div class="controls">
          <div class="controls-grid">
            <div class="field" style="margin: 0">
              <label for="walkMinutes">轉車步行（分鐘）</label>
              <input id="walkMinutes" type="number" min="0" step="1" placeholder="自動估算" />
            </div>
            <div class="field" style="margin: 0">
              <label for="bufferMinutes">額外緩衝（分鐘）</label>
              <input id="bufferMinutes" type="number" min="0" step="1" value="1" />
            </div>
            <button class="cta" id="matchBtn" type="button">檢查轉乘時間</button>
          </div>
          <p class="hint" id="walkHint">
            未選齊兩站前，會用直線距離估算步行時間；你亦可以人手改。
          </p>
        </div>

        <div class="result" id="result" aria-live="polite"></div>
        <p class="meta">
          資料來源：DATA.GOV.HK / KMB ETA、Citybus Next Bus。ETA 大約每分鐘更新；實際路面情況可能有偏差。
        </p>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
